
name: Build XVR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o XVR-Android-Project.zip
          cp -a XVR-Android/. .

      - name: Fix duplicate licenses
        run: |
          sed -i '/^android {/a\    packaging {\n        resources {\n            excludes += ["/META-INF/LICENSE.md", "/META-INF/NOTICE.md"]\n        }\n    }' app/build.gradle

      - name: Fix Java Message conflict
        run: |
          FILE=app/src/main/java/com/xvr/mail/MainActivity.java
          sed -i 's/\bMessage\b/javax.mail.Message/g' "$FILE"
          sed -i 's/m\.isSet(Flags\.Flag\.SEEN)/isSeen(m)/g' "$FILE"
          sed -i '/private void load(boolean doSearch)/i\ private boolean isSeen(javax.mail.Message m){try{return m.isSet(Flags.Flag.SEEN);}catch(Exception e){return false;}}' "$FILE"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XVR-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
